name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: triproof_testing
          MARIADB_USER: triproof
          MARIADB_PASSWORD: triproof
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: triproof_testing
      DB_USERNAME: triproof
      DB_PASSWORD: triproof
      AI_PROVIDER: none
      TRIPROOF_DEMO_SEED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: sodium, pdo_mysql, mbstring, dom, fileinfo, curl, openssl, zlib, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Copy environment
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Generate signing keys
        run: php artisan triproof:keys --write --force

      - name: Prepare writable directories
        run: chmod -R u+w storage bootstrap/cache

      - name: Build assets
        run: npm ci && npm run build

      - name: Run tests
        run: php artisan test

      - name: Check code style
        run: vendor/bin/pint --test
