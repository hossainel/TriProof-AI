name: Android scanner
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Install the API 35 test device
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'emulator' 'system-images;android-35;aosp_atd;x86_64'
      - name: Allow the runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: ./gradlew :app:scannerApi35DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect -Pandroid.testInstrumentationRunnerArguments.airplane=true
      - name: Build the unsigned release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_API: ${{ vars.TRIPROOF_API_BASE_URL || 'https://triproof.local/api/v1/' }}
          RELEASE_PUBLIC_KEY: ${{ vars.TRIPROOF_PUBLIC_KEY }}
        run: |
          args=("-PAPI_BASE_URL=$RELEASE_API")
          if [[ -n "$RELEASE_PUBLIC_KEY" ]]; then args+=("-PTRIPROOF_PUBLIC_KEY=$RELEASE_PUBLIC_KEY"); fi
          ./gradlew :app:bundleRelease "${args[@]}"
      - name: Upload scanner builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: triproof-ai-scanner-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
