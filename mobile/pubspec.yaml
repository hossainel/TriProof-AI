name: triproof_ai_scanner
description: >-
  TriProof AI Scanner — Offline-first (<50ms) cryptographic product
  authenticity verification, on-device ML Kit Vision AI & OCR scanner,
  anti-clock-rollback security, and store-and-forward retroactive clone/recall
  sync for Android and iOS.
publish_to: "none"
version: 2.1.1+2

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Offline Ed25519 Cryptography & Hardware-Backed Keystore
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  crypto: ^3.0.8
  flutter_secure_storage: ^10.2.0

  # On-Device Computer Vision & OCR (Zero Cloud Dependency)
  camera: ^0.11.3+1
  google_mlkit_barcode_scanning: ^1.0.3
  google_mlkit_text_recognition: ^1.0.2
  google_mlkit_commons: ^1.0.0

  # Encrypted Local SQLite Storage
  sqflite_sqlcipher: ^3.4.0
  path: ^1.9.1

  # Background Sync, Network, GPS Time, & Push Notifications
  connectivity_plus: ">=7.0.0 <7.3.2"
  flutter_local_notifications: ^22.3.3
  geolocator: ^14.0.2
  http: ^1.6.0
  uuid: ^4.6.0

  # Sensory Feedback, Ownership Transfer QR & Permissions
  audioplayers: ^6.8.1
  vibration: ^3.2.1
  qr_flutter: ^4.1.0
  permission_handler: ^13.0.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/audio/chime_genuine.wav
    - assets/audio/alarm_alert.wav
  fonts:
    - family: MaterialIcons
      fonts:
        - asset: fonts/MaterialIcons-Regular.otf
